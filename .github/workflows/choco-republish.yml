name: Choco Republish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish to Chocolatey (e.g. v1.2.0+21.7)'
        required: true
        type: string

jobs:
  choco-publish:
    name: Publish Chocolatey Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Build and push nupkg
        shell: pwsh
        run: |
          $tag     = "${{ inputs.tag }}"
          $version = $tag.TrimStart('v')                        # e.g. 1.2.2+21.7
          $nugetVer = ($version -split '\+')[0]                 # e.g. 1.2.2  (NuGet v2 不允许 '+')

          # ── 1. 从 GitHub Release 下载 Windows zip，计算 SHA256 ──────────────────
          $assets = @{
            amd64 = "zentao-cli-$version-windows-amd64.zip"
            arm64 = "zentao-cli-$version-windows-arm64.zip"
          }
          New-Item -ItemType Directory -Force -Path pkg | Out-Null
          $checksums = @{}
          $urls      = @{}
          $ProgressPreference = 'SilentlyContinue'
          foreach ($arch in $assets.Keys) {
            $name = $assets[$arch]
            # GitHub Release URL 中 '+' 需要编码为 '%2B'
            $url  = "https://github.com/windosx/zentao-cli/releases/download/$($tag -replace '\+','%2B')/$($name -replace '\+','%2B')"
            $dest = "pkg/$name"
            Write-Host "==> Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dest
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            Write-Host "    SHA256($arch): $hash"
            $checksums[$arch] = $hash
            $urls[$arch]      = "https://github.com/windosx/zentao-cli/releases/download/$tag/$name"
          }

          # ── 2. 生成 chocolateyInstall.ps1 ──────────────────────────────────────
          New-Item -ItemType Directory -Force -Path "pkg/tools" | Out-Null
          $ps1 = @"
`$ErrorActionPreference = 'Stop'
`$toolsDir = Split-Path -Parent `$MyInvocation.MyCommand.Definition
`$packageArgs = @{
  packageName   = 'zentao-cli'
  unzipLocation = `$toolsDir
  fileType      = 'zip'
  url64bit      = '$($urls['amd64'])'
  checksum64    = '$($checksums['amd64'])'
  checksumType64= 'sha256'
  url           = '$($urls['arm64'])'
  checksum      = '$($checksums['arm64'])'
  checksumType  = 'sha256'
}
Install-ChocolateyZipPackage @packageArgs

# シンボリックリンクで zentao.exe を PATH に追加
`$zentaoExe = Get-ChildItem `$toolsDir -Recurse -Filter 'zentao.exe' | Select-Object -First 1
if (`$zentaoExe) {
  `$shimTarget = Join-Path `$toolsDir 'zentao.exe'
  if (`$shimTarget -ne `$zentaoExe.FullName) {
    Copy-Item `$zentaoExe.FullName `$shimTarget -Force
  }
}
"@
          Set-Content -Path "pkg/tools/chocolateyInstall.ps1" -Value $ps1 -Encoding UTF8

          # ── 3. 生成 .nuspec ────────────────────────────────────────────────────
          $nuspec = @"
<?xml version="1.0" encoding="utf-8"?>
<package xmlns="http://schemas.microsoft.com/packaging/2015/06/nuspec.xsd">
  <metadata>
    <id>zentao-cli</id>
    <version>$nugetVer</version>
    <title>ZenTao CLI</title>
    <authors>windosx</authors>
    <owners>windosx</owners>
    <projectUrl>https://github.com/windosx/zentao-cli</projectUrl>
    <licenseUrl>https://github.com/windosx/zentao-cli/blob/main/LICENSE</licenseUrl>
    <projectSourceUrl>https://github.com/windosx/zentao-cli</projectSourceUrl>
    <docsUrl>https://github.com/windosx/zentao-cli#readme</docsUrl>
    <bugTrackerUrl>https://github.com/windosx/zentao-cli/issues</bugTrackerUrl>
    <requireLicenseAcceptance>false</requireLicenseAcceptance>
    <summary>ZenTao PMS CLI and Go SDK for AI coding agents and modern developers</summary>
    <description>ZenTao PMS (禅道) CLI tool and Go SDK designed for AI coding agents (Claude Code, ZCode, Cursor, OpenHands) and modern developers.

Key Features:
- Zero-Auth Persistent Sessions: Single login via system keychain with transparent session auto-refresh when server sessions expire.
- Full Workbench Support: Complete coverage for personal tasks, assigned bugs, todos, stories, projects, products, and activity dynamics.
- Agent-Ready Structured Output: Unified JSON envelopes, ASCII tables, and deterministic exit codes.
- Universal ZenTao Version Compatibility: Direct alignment with ZenTao native web controllers and PHP SDK across legacy and modern versions.
    </description>
    <tags>zentao zentao-cli cli sdk project-management agile bug-tracker automation ai-agent</tags>
  </metadata>
  <files>
    <file src="tools\**" target="tools" />
  </files>
</package>
"@
          Set-Content -Path "pkg/zentao-cli.nuspec" -Value $nuspec -Encoding UTF8

          # ── 4. choco pack ──────────────────────────────────────────────────────
          Push-Location pkg
          choco pack zentao-cli.nuspec --outputdirectory .
          Pop-Location

          $nupkg = Get-ChildItem -Path pkg -Filter "zentao-cli.$nugetVer.nupkg" | Select-Object -First 1
          if (-not $nupkg) { $nupkg = Get-ChildItem -Path pkg -Filter "*.nupkg" | Select-Object -First 1 }
          if (-not $nupkg) { Write-Error "No .nupkg found"; exit 1 }
          Write-Host "==> Package: $($nupkg.FullName)"

          # ── 5. push to Chocolatey ─────────────────────────────────────────────
          $maxRetries = 3
          $success    = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "==> Uploading (attempt $i/$maxRetries)..."
            $curlOut = & curl.exe -s -S -X PUT `
              -H "X-NuGet-ApiKey: $($env:CHOCOLATEY_API_KEY)" `
              -F "package=@$($nupkg.FullName)" `
              https://push.chocolatey.org/api/v2/package/ 2>&1
            Write-Host "Response: $curlOut"
            if ($curlOut -match "Package has been pushed" -or $curlOut -match "201") {
              Write-Host "==> Successfully pushed!"
              $success = $true; break
            }
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            if ($LASTEXITCODE -eq 0) { $success = $true; break }
            if ($i -lt $maxRetries) { Write-Host "==> Retrying in 30s..."; Start-Sleep -Seconds 30 }
          }
          if (-not $success) { Write-Error "==> Push failed after $maxRetries attempts"; exit 1 }
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

