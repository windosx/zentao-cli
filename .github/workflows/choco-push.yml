name: Choco Push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish to Chocolatey (e.g. v1.2.0+21.7)'
        required: true
        type: string

jobs:
  choco-publish:
    name: Publish Chocolatey Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 始终 checkout main，模板文件在 main 上，不需要 tag 的源码

      - name: Build and push nupkg
        shell: pwsh
        run: |
          $tag      = "${{ inputs.tag }}"
          $version  = $tag.TrimStart('v')
          $nugetVer = ($version -split '\+')[0]

          # 1. Download Windows zips from GitHub Release and compute SHA256
          $archs = @('amd64', 'arm64')
          $checksums = @{}
          $urls = @{}
          New-Item -ItemType Directory -Force -Path pkg/tools | Out-Null
          $ProgressPreference = 'SilentlyContinue'
          foreach ($arch in $archs) {
            $name = "zentao-cli-$version-windows-$arch.zip"
            $encodedTag  = $tag  -replace '\+', '%2B'
            $encodedName = $name -replace '\+', '%2B'
            $url  = "https://github.com/windosx/zentao-cli/releases/download/$encodedTag/$encodedName"
            $dest = "pkg/$name"
            Write-Host "Downloading $url"
            Invoke-WebRequest -Uri $url -OutFile $dest
            $hash = (Get-FileHash $dest -Algorithm SHA256).Hash.ToLower()
            Write-Host "SHA256($arch): $hash"
            $checksums[$arch] = $hash
            $urls[$arch] = "https://github.com/windosx/zentao-cli/releases/download/$tag/$name"
          }

          # 2. Render chocolateyInstall.ps1 from template
          $ps1 = (Get-Content .choco/chocolateyInstall.ps1.tmpl -Raw) `
            -replace '{{URL_AMD64}}',      $urls['amd64'] `
            -replace '{{CHECKSUM_AMD64}}', $checksums['amd64'] `
            -replace '{{URL_ARM64}}',      $urls['arm64'] `
            -replace '{{CHECKSUM_ARM64}}', $checksums['arm64']
          Set-Content -Path pkg/tools/chocolateyInstall.ps1 -Value $ps1 -Encoding UTF8

          # 3. Render zentao-cli.nuspec from template
          $nuspec = (Get-Content .choco/zentao-cli.nuspec.tmpl -Raw) `
            -replace '{{NUGET_VERSION}}', $nugetVer
          Set-Content -Path pkg/zentao-cli.nuspec -Value $nuspec -Encoding UTF8

          # 4. choco pack
          Push-Location pkg
          choco pack zentao-cli.nuspec --outputdirectory .
          Pop-Location
          $nupkg = Get-ChildItem pkg -Filter "zentao-cli.$nugetVer.nupkg" | Select-Object -First 1
          if (-not $nupkg) { $nupkg = Get-ChildItem pkg -Filter "*.nupkg" | Select-Object -First 1 }
          if (-not $nupkg) { Write-Error "No .nupkg found"; exit 1 }
          Write-Host "Package: $($nupkg.FullName)"

          # 5. Push to Chocolatey
          $maxRetries = 3
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "Uploading (attempt $i/$maxRetries)..."
            $curlOut = & curl.exe -s -S -X PUT `
              -H "X-NuGet-ApiKey: $($env:CHOCOLATEY_API_KEY)" `
              -F "package=@$($nupkg.FullName)" `
              https://push.chocolatey.org/api/v2/package/
            Write-Host "Response: $curlOut"
            if ($curlOut -match "Package has been pushed" -or $curlOut -match "201") {
              Write-Host "Successfully pushed!"; $success = $true; break
            }
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            if ($LASTEXITCODE -eq 0) { $success = $true; break }
            if ($i -lt $maxRetries) { Write-Host "Retrying in 30s..."; Start-Sleep -Seconds 30 }
          }
          if (-not $success) { Write-Error "Push failed after $maxRetries attempts"; exit 1 }
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
