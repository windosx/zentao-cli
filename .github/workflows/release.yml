name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  validate:
    name: Validate Tag Format
    runs-on: ubuntu-latest
    steps:
      - name: Validate SemVer 2.0 Build Metadata Tag Format
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          echo "==> Validating tag format for: $TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+(\.[0-9]+)*$ ]]; then
            echo "Error: Tag '$TAG' does not conform to SemVer 2.0 Build Metadata format (e.g. v1.0.9+21.7)" >&2
            exit 1
          fi
          echo "==> Tag format is valid!"

  goreleaser:
    name: GoReleaser Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.18.0

      - name: Run GoReleaser
        id: goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # chocolatey 需要 choco 命令，仅在 windows runner 上可用，单独由 choco-publish job 处理
          args: release --clean --skip=chocolatey
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          WINGET_GITHUB_TOKEN: ${{ secrets.WINGET_GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Attest checksums
        if: always()
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/zentao-cli-${{ fromJSON(steps.goreleaser.outputs.metadata).version }}-checksums.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest digests (SBOM)
        if: always()
        continue-on-error: true
        uses: actions/attest@v4
        with:
          subject-checksums: ./dist/digests.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}

  choco-publish:
    name: Publish Chocolatey Package
    needs: goreleaser
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build nupkg via GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # 跳过 GitHub Release 上传（主 job 已完成）及所有 windows 上不可用/不必要的步骤
          args: release --clean --skip=publish,validate,announce,sbom,homebrew,winget,sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}

      - name: Push nupkg to Chocolatey
        shell: pwsh
        run: |
          # 1. 在 dist/ 目录中定位 GoReleaser 生成的原始 .nuspec 文件
          $nuspecFile = Get-ChildItem -Path dist -Filter "*.nuspec" -Recurse | Select-Object -First 1
          if ($nuspecFile) {
            Write-Host "==> Normalizing NuGet v2 version in $($nuspecFile.FullName)..."
            $content = Get-Content $nuspecFile.FullName -Raw
            # 剥离 SemVer 2.0 的 '+' build metadata，例如将 1.1.0+21.7 转为符合 NuGet v2 规范的 1.1.0
            $content = $content -replace '<version>([^<+]+)\+[^<]*</version>', '<version>$1</version>'
            Set-Content -Path $nuspecFile.FullName -Value $content -NoNewline
            
            # 使用 choco.exe 原生重新打包，确保 ZIP/OPC 格式与清单哈希 100% 正确
            Write-Host "==> Repacking with choco.exe..."
            choco pack $nuspecFile.FullName --outputdirectory dist
          }

          # 2. 找到打包后的标准 .nupkg 文件（优先选取无 '+' 的标准包）
          $nupkg = Get-ChildItem -Path dist -Filter "*.nupkg" | Where-Object { $_.Name -notmatch "\+" } | Select-Object -First 1
          if (-not $nupkg) {
            $nupkg = Get-ChildItem -Path dist -Filter "*.nupkg" -Recurse | Select-Object -First 1
          }
          if (-not $nupkg) { Write-Error "No .nupkg found in dist/"; exit 1 }
          Write-Host "==> Target package for upload: $($nupkg.FullName)"

          # 3. 推送到 Chocolatey
          $maxRetries = 3
          $success = $false
          for ($i = 1; $i -le $maxRetries; $i++) {
            Write-Host "==> Uploading via direct NuGet v2 API with curl.exe (attempt $i/$maxRetries)..."
            $curlOut = & curl.exe -s -S -X PUT -H "X-NuGet-ApiKey: $($env:CHOCOLATEY_API_KEY)" -F "package=@$($nupkg.FullName)" https://push.chocolatey.org/api/v2/package/ 2>&1
            Write-Host "Response: $curlOut"
            if ($curlOut -match "Package has been pushed" -or $curlOut -match "created" -or $curlOut -match "201") {
              Write-Host "==> Successfully pushed to Chocolatey via NuGet API!"
              $success = $true
              break
            }

            Write-Host "==> Direct API push returned non-success response, trying choco push fallback..."
            choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
            if ($LASTEXITCODE -eq 0) {
              $success = $true
              break
            }

            if ($i -lt $maxRetries) {
              Write-Host "==> Push failed (attempt $i/$maxRetries), retrying in 30s..."
              Start-Sleep -Seconds 30
            }
          }
          if (-not $success) {
            Write-Error "==> Chocolatey push failed after $maxRetries attempts"
            exit 1
          }
        env:
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
