# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: zentao-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: zentao
    binary: zentao
    main: ./main.go
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/windosx/zentao-cli/cmd.Version={{.Version}}
      - -X github.com/windosx/zentao-cli/cmd.GitCommit={{.Commit}}
      - -X github.com/windosx/zentao-cli/cmd.BuildDate={{.Date}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

# 源码包：便于 go install / go get 及审计构建
source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Version }}-source'

# 软件物料清单 (SBOM)，对标成熟开源项目供应链实践
sboms:
  - id: archive
    artifacts: archive

archives:
  - id: default
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    formats:
      - tar.gz
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - skills/**/*

# 1. Linux DEB / RPM 包 (APT / DNF 源)
nfpms:
  - id: zentao-cli
    package_name: zentao-cli
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: windosx
    maintainer: "windosx <support@windosx.com>"
    homepage: "https://github.com/windosx/zentao-cli"
    description: "ZenTao PMS CLI and Go SDK for AI agents and modern developers"
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    umask: 0o022
    overrides:
      deb:
        contents:
          - src: ./LICENSE
            dst: /usr/share/doc/zentao-cli/copyright
          - src: ./README.md
            dst: /usr/share/doc/zentao-cli/README.md
      rpm:
        contents:
          - src: ./LICENSE
            dst: /usr/share/doc/zentao-cli/LICENSE
            type: license
          - src: ./README.md
            dst: /usr/share/doc/zentao-cli/README.md
            type: readme

# 2. Homebrew (macOS / Linux) - v2 homebrew_casks
homebrew_casks:
  - name: zentao
    repository:
      owner: windosx
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: "https://github.com/windosx/zentao-cli"
    description: "ZenTao PMS CLI and Go SDK for AI agents and modern developers"
    # 配置 windosx/homebrew-tap 仓库及 token 后改为 false 以自动推送
    skip_upload: true
    commit_author:
      name: windosx-bot
      email: bot@windosx.com
    binaries:
      - zentao

# 3. Windows Package Manager (WinGet)
winget:
  - name: zentao-cli
    package_name: zentao-cli
    package_identifier: windosx.zentao-cli
    publisher: windosx
    publisher_url: "https://github.com/windosx"
    homepage: "https://github.com/windosx/zentao-cli"
    license: MIT
    license_url: "https://github.com/windosx/zentao-cli/blob/main/LICENSE"
    short_description: "ZenTao PMS CLI and Go SDK for AI agents and modern developers"
    description: |
      ZenTao PMS CLI and Go SDK designed for AI Agent tool calling and modern developers.
      Provides zero-auth persistent sessions and full workbench support.
    tags:
      - zentao
      - zentao-cli
      - cli
      - agent
      - project-management
    # 配置 windosx/winget-pkgs 仓库及 token 后改为 false 以自动推送
    skip_upload: true
    repository:
      owner: windosx
      name: winget-pkgs
      branch: main
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
    commit_author:
      name: windosx-bot
      email: bot@windosx.com

# 4. Chocolatey for Windows (需在 windows-latest runner 上构建)
chocolateys:
  - name: zentao-cli
    title: ZenTao CLI
    owners: windosx
    authors: windosx
    project_url: "https://github.com/windosx/zentao-cli"
    project_source_url: "https://github.com/windosx/zentao-cli"
    docs_url: "https://github.com/windosx/zentao-cli#readme"
    bug_tracker_url: "https://github.com/windosx/zentao-cli/issues"
    license_url: "https://github.com/windosx/zentao-cli/blob/main/LICENSE"
    require_license_acceptance: false
    summary: "ZenTao PMS CLI and Go SDK"
    description: |
      ZenTao PMS CLI and Go SDK designed for AI Agent tool calling and modern developers.
      Provides zero-auth persistent sessions and full workbench support.
    tags: "zentao zentao-cli cli sdk project-management agile"
    # 仅生成 nupkg 到 dist；配置 CHOCOLATEY_API_KEY 并改为 false 后自动推送
    skip_publish: true
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"

snapshot:
  version_template: SNAPSHOT-{{ .Commit }}

checksum:
  name_template: '{{ .ProjectName }}-{{ .Version }}-checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch
  groups:
    - title: "Features"
      regexp: '^feat[(\w)]*:+.*$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix[(\w)]*:+.*$'
      order: 1
    - title: "Performance Improvements"
      regexp: '^perf[(\w)]*:+.*$'
      order: 2
    - title: "Maintenance & Refactor"
      regexp: '^(refactor|style)[(\w)]*:+.*$'
      order: 3
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: windosx
    name: zentao-cli
  header: |
    ## zentao-cli {{ .Version }}

    `zentao-cli` 是面向 AI Agent 与现代开发者的禅道 (ZenTao PMS) 命令行工具与 Go SDK。

    安装方式详见 [README](https://github.com/windosx/zentao-cli#readme)。
  draft: false
  prerelease: auto
  mode: replace
