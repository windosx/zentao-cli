version: "2"

run:
  timeout: 5m
  tests: true

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - gosec
    - revive
    - unconvert
    - whitespace
    - bodyclose
    - nilerr
  settings:
    govet:
      enable:
        - appends
        - asmdecl
        - assign
        - atomic
        - bools
        - buildtag
        - cgocall
        - composite
        - copylocks
        - deepequalerrors
        - errorsas
        - framepointer
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - printf
        - shift
        - sigchanyzer
        - slog
        - sortslice
        - stdmethods
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedresult
    revive:
      rules:
        - name: exported
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
  exclusions:
    generated: lax
    rules:
      - path: '(.+)_test\.go'
        linters:
          - gosec
          - errcheck
          - revive
      - text: 'G304' # 文件路径来自用户显式配置，非受控输入
        linters:
          - gosec
      - text: 'G117' # 配置落盘包含密码字段由用户显式启用
        linters:
          - gosec