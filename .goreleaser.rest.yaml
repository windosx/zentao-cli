# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: zentao-cli

before:
  hooks:
    - go mod tidy

builds:
  - id: zentao-rest
    binary: zentao
    main: ./main.go
    flags:
      - -trimpath
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/windosx/zentao-cli/cmd.Version={{.Version}}
      - -X github.com/windosx/zentao-cli/cmd.GitCommit={{.Commit}}
      - -X github.com/windosx/zentao-cli/cmd.BuildDate={{.Date}}
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    name_template: '{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}'
    formats:
      - tar.gz
    wrap_in_directory: true
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE*
      - NOTICE
      - skills/**/*

winget:
  - name: zentao-cli
    package_name: zentao-cli
    package_identifier: windosx.zentao-cli
    publisher: windosx
    publisher_url: "https://github.com/windosx"
    homepage: "https://github.com/windosx/zentao-cli"
    license: MIT
    license_url: "https://github.com/windosx/zentao-cli/blob/main/LICENSE"
    short_description: "ZenTao PMS CLI and Go SDK for AI agents and modern developers"
    description: |
      ZenTao PMS CLI and Go SDK designed for AI Agent tool calling and modern developers.
      Provides zero-auth persistent sessions and full workbench support.
    tags:
      - zentao
      - zentao-cli
      - cli
      - agent
      - project-management
    repository:
      owner: windosx
      name: winget-pkgs
      token: "{{ .Env.WINGET_GITHUB_TOKEN }}"
      pull_request:
        enabled: true
        base:
          owner: microsoft
          name: winget-pkgs
          branch: master
    commit_author:
      name: windosx
      email: windosx@163.com

chocolateys:
  - name: zentao-cli
    title: ZenTao CLI
    owners: windosx
    authors: windosx
    project_url: "https://github.com/windosx/zentao-cli"
    project_source_url: "https://github.com/windosx/zentao-cli"
    docs_url: "https://github.com/windosx/zentao-cli#readme"
    bug_tracker_url: "https://github.com/windosx/zentao-cli/issues"
    license_url: "https://github.com/windosx/zentao-cli/blob/main/LICENSE"
    require_license_acceptance: false
    summary: "ZenTao PMS CLI and Go SDK"
    description: |
      ZenTao PMS CLI and Go SDK designed for AI Agent tool calling and modern developers.
      Provides zero-auth persistent sessions and full workbench support.
    tags: "zentao zentao-cli cli sdk project-management agile"
    skip_publish: false
    api_key: "{{ .Env.CHOCOLATEY_API_KEY }}"
    source_repo: "https://push.chocolatey.org/"

release:
  github:
    owner: windosx
    name: zentao-cli
  draft: false
  prerelease: auto
  mode: replace
